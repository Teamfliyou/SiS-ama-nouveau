server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Taille maximale autorisée pour les imports CSV / payloads JSON.
  client_max_body_size 10m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # API : tout /api/* est reverse-proxyé vers le backend Express.
  location /api {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # SPA : fallback sur index.html pour le routing côté client.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache immutable sur les assets hashés par Vite.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri $uri/ =404;
  }
}